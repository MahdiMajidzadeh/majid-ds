name: Docs

# Regenerates docs/ on every release tag and commits the result to main.
#
# docs/ is a committed static site: GitHub Pages serves main's docs/ folder
# as-is, with no build step of its own, and the folder is export-ignored so
# the Packagist dist never contained it. The pages used to be regenerated by
# hand on every change, with a CI job that rebuilt them and failed on a dirty
# tree. That made every pull request carry thousands of lines of generated
# HTML. Now the pages are rebuilt once, here, when a version is tagged — the
# moment the site should match the released code.
#
# Both builders are deterministic (they pin the clock and the Livewire CSRF
# token), so when the rebuild changes nothing there is nothing to commit and
# the job ends with a notice.
#
# The commit is pushed with the job's own GITHUB_TOKEN. Pushes made with that
# token never fire `on: push` workflows, so this does not re-run CI and it
# cannot loop into itself.

on:
  push:
    tags: ['v*']

# One push to main at a time. Keyed on a constant, not on github.ref: two tags
# pushed close together would otherwise both race for main, and cancelling one
# mid-push is worse than queueing it.
concurrency:
  group: docs-main
  cancel-in-progress: false

jobs:
  build:
    name: Regenerate docs/ for ${{ github.ref_name }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # main, not the tag's detached commit: the result is committed on top
      # of main, and committing on the tag would fail non-fast-forward the
      # moment main had moved past it.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Require the tag to be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" HEAD; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not reachable from main. Nothing regenerated."
            exit 1
          fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, dom, libxml
          coverage: none

      - uses: ramsey/composer-install@v4
        env:
          # livewire/flux's dist is a GitHub zipball and unauthenticated
          # runners hit the API rate limit. The runner's own token lifts that.
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run docs

      - run: npm run pages

      - name: Commit the regenerated site to main
        run: |
          if [ -z "$(git status --porcelain docs)" ]; then
            echo "::notice::docs/ already matched ${GITHUB_REF_NAME}. Nothing to commit."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          git commit -m "Regenerate the docs site for ${GITHUB_REF_NAME}"
          git push origin HEAD:main
